<style>/* =====================================================================
   CQA Executive Dashboard — styles (minimal · light/dark · responsive)
   โทนสีต่อยอดจาก QA Data Hub (navy + orange) · palette กราฟผ่าน CVD validator
   ===================================================================== */
:root{
  --font:'Sarabun','Leelawadee UI','Tahoma','Noto Sans Thai',system-ui,sans-serif;
  --bg:#F4F6FA; --surface:#FFFFFF; --surface-2:#F1F3F8; --surface-3:#E5E9F1;
  --line:#E2E6EE; --line-strong:#C8CFDC;
  --ink:#151A33; --ink-2:#4A5373; --ink-3:#767E9A;
  --topbar:#1E2761; --topbar-ink:#FFFFFF; --topbar-ink-2:#C9D3F2;
  --navy:#1E2761; --navy-fill:#1E2761; --accent:#EE7623; --accent-soft:#FDEBDD; --accent-ink:#B04C0A;
  --c1:#2a78d6; --c2:#eb6834; --c3:#1baf7a; --c4:#eda100; --c5:#e87ba4; --c6:#008300; --c7:#4a3aa7; --c8:#e34948;
  --c-muted:#B9C1D2;
  --ok:#0ca30c; --warn:#fab219; --serious:#ec835a; --bad:#d03b3b; --gray:#A3AABB;
  --ok-ink:#06730a; --warn-ink:#8A5A00; --bad-ink:#B42323;
  --ok-soft:#E3F4E3; --warn-soft:#FDF2D6; --bad-soft:#FBE4E4; --info-soft:#E8F0FC;
  --gA:#0ca30c; --gB:#86b6ef; --gC:#fab219; --gD:#d03b3b;
  --tip-bg:#151A33; --tip-ink:#FFFFFF;
  --shadow:0 1px 2px rgba(21,26,51,.04),0 2px 8px rgba(21,26,51,.04);
  --topbar-h:58px; --fbar-h:52px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0D1126; --surface:#151A36; --surface-2:#1B2144; --surface-3:#252C55;
    --line:#283060; --line-strong:#3A4377;
    --ink:#E8EBF7; --ink-2:#B4BAD7; --ink-3:#8A92B6;
    --navy:#A9B8FF; --navy-fill:#3B4BA8; --accent:#F28A45; --accent-soft:#3B2515; --accent-ink:#F6A36B;
    --c1:#3987e5; --c2:#d95926; --c3:#199e70; --c4:#c98500; --c5:#d55181; --c6:#008300; --c7:#9085e9; --c8:#e66767;
    --c-muted:#46507F;
    --ok-ink:#3FC63F; --warn-ink:#F2C14E; --bad-ink:#F07373;
    --ok-soft:#14321C; --warn-soft:#3A2E18; --bad-soft:#3C1D24; --info-soft:#1C2A4E;
    --gB:#5598e7;
    --tip-bg:#E8EBF7; --tip-ink:#151A36;
    --shadow:none;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D1126; --surface:#151A36; --surface-2:#1B2144; --surface-3:#252C55;
  --line:#283060; --line-strong:#3A4377;
  --ink:#E8EBF7; --ink-2:#B4BAD7; --ink-3:#8A92B6;
  --navy:#A9B8FF; --navy-fill:#3B4BA8; --accent:#F28A45; --accent-soft:#3B2515; --accent-ink:#F6A36B;
  --c1:#3987e5; --c2:#d95926; --c3:#199e70; --c4:#c98500; --c5:#d55181; --c6:#008300; --c7:#9085e9; --c8:#e66767;
  --c-muted:#46507F;
  --ok-ink:#3FC63F; --warn-ink:#F2C14E; --bad-ink:#F07373;
  --ok-soft:#14321C; --warn-soft:#3A2E18; --bad-soft:#3C1D24; --info-soft:#1C2A4E;
  --gB:#5598e7;
  --tip-bg:#E8EBF7; --tip-ink:#151A36;
  --shadow:none;
  color-scheme:dark;
}

*{box-sizing:border-box}
html,body{margin:0}
body{font-family:var(--font);background:var(--bg);color:var(--ink);font-size:14.5px;line-height:1.55;-webkit-font-smoothing:antialiased}
button,select,input,textarea{font:inherit;color:inherit}
[hidden]{display:none !important}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
a{color:var(--c1)}
.muted{color:var(--ink-3)} .small{font-size:12.5px} .nowrap{white-space:nowrap}
.num{font-variant-numeric:tabular-nums}

/* ---------- loading ---------- */
.boot{position:fixed;inset:0;display:grid;place-items:center;background:var(--bg);z-index:100;color:var(--ink-2);font-size:15px}
.boot b{display:block;font-size:18px;color:var(--ink);margin-bottom:4px}

/* ---------- top bar ---------- */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;display:flex;align-items:center;gap:12px 16px;padding:9px 20px;background:var(--topbar);color:var(--topbar-ink);min-height:var(--topbar-h)}
.brand{display:flex;align-items:center;gap:12px;margin-right:auto;min-width:0}
.brand-mark{width:38px;height:38px;border-radius:10px;background:#EE7623;color:#fff;display:grid;place-items:center;font-weight:700;font-size:13px;letter-spacing:.3px;flex:none}
.brand-title{font-weight:700;font-size:17.5px;line-height:1.2}
.brand-sub{font-size:12px;color:var(--topbar-ink-2)}
.tb-actions{display:flex;align-items:center;gap:8px}
.proto-badge{font-size:12px;padding:3px 10px;border-radius:999px;border:1px solid #EE7623;color:#FFD2B3;white-space:nowrap}
.tb-btn{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.22);color:#fff;border-radius:9px;min-height:36px;padding:6px 10px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;font-size:13.5px}
.tb-btn:hover{background:rgba(255,255,255,.16)}
.tb-btn svg{width:17px;height:17px}
.btn-ask{background:#fff;color:#1E2761;border:0;border-radius:10px;padding:7px 13px;font-weight:600;cursor:pointer;min-height:36px;display:inline-flex;align-items:center;gap:7px;white-space:nowrap}
.btn-ask:hover{background:#FDEBDD}
.btn-ask svg{width:17px;height:17px}

/* ---------- filter bar ---------- */
.fbar{position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--topbar-h));z-index:35;display:flex;align-items:center;flex-wrap:wrap;gap:8px 10px;padding:9px 20px;background:var(--surface);border-bottom:1px solid var(--line)}
.fbar .f{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--ink-3)}
.fbar select{border:1px solid var(--line-strong);border-radius:8px;background:var(--surface);color:var(--ink);padding:4px 8px;min-height:32px;max-width:220px;cursor:pointer;font-size:13.5px}
.fbar .sep{width:1px;height:22px;background:var(--line)}
.toggle{display:inline-flex;align-items:center;gap:7px;font-size:13px;color:var(--ink-2);cursor:pointer;user-select:none}
.toggle input{accent-color:var(--navy-fill);width:16px;height:16px}
.fbar .spacer{flex:1}
.scope-note{font-size:12.5px;color:var(--ink-3)}

/* ---------- shell ---------- */
.shell{display:grid;grid-template-columns:224px minmax(0,1fr);min-height:calc(100vh - var(--topbar-h) - var(--fbar-h))}
.rail{position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--topbar-h) + var(--fbar-h));align-self:start;height:calc(100vh - var(--topbar-h) - var(--fbar-h));overflow:auto;padding:12px 10px 24px;border-right:1px solid var(--line);background:var(--surface)}
.rail-group{font-size:11.5px;color:var(--ink-3);padding:14px 10px 4px;letter-spacing:.2px}
.rail-group:first-child{padding-top:2px}
.rail button{display:flex;align-items:center;gap:9px;width:100%;padding:7px 9px;border:0;border-radius:8px;background:none;color:var(--ink-2);cursor:pointer;text-align:left;font-size:14px;line-height:1.3}
.rail button:hover{background:var(--surface-2);color:var(--ink)}
.rail button[aria-current="page"]{background:var(--surface-2);color:var(--navy);font-weight:600}
.rail .no{flex:none;min-width:24px;height:20px;border-radius:6px;background:var(--surface-3);color:var(--ink-2);font-size:11px;font-weight:600;display:grid;place-items:center;padding:0 4px}
.rail button[aria-current="page"] .no{background:var(--navy-fill);color:#fff}
.rail .ico{flex:none;width:24px;display:grid;place-items:center}
.rail .ico svg{width:17px;height:17px}
.rail .rdot{margin-left:auto;width:7px;height:7px;border-radius:50%;background:var(--bad);flex:none}
.rail-note{margin:18px 10px 0;font-size:12px;color:var(--ink-3);line-height:1.55}
main{padding:20px 26px 60px;min-width:0;outline:none}
.page{max-width:1440px}

/* ---------- page head ---------- */
.page-head{display:flex;justify-content:space-between;align-items:flex-end;gap:10px 20px;flex-wrap:wrap;margin-bottom:14px}
.page-head h1{margin:0;font-size:23px;line-height:1.25;font-weight:700;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.page-head h1 .tno{font-size:13px;font-weight:600;background:var(--navy-fill);color:#fff;border-radius:7px;padding:2px 8px}
.page-head p{margin:3px 0 0;color:var(--ink-2);max-width:90ch}
.head-actions{display:flex;gap:8px;flex-wrap:wrap}
.meta-row{display:flex;flex-wrap:wrap;gap:6px 14px;margin:6px 0 0;font-size:12.5px;color:var(--ink-3)}
.meta-row b{color:var(--ink-2);font-weight:600}

/* ---------- chips / tags / status ---------- */
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:500;padding:1px 8px;border-radius:999px;white-space:nowrap;border:1px solid transparent;line-height:1.6}
.chip.ok{background:var(--ok-soft);color:var(--ok-ink)}
.chip.warn{background:var(--warn-soft);color:var(--warn-ink)}
.chip.bad{background:var(--bad-soft);color:var(--bad-ink)}
.chip.info{background:var(--info-soft);color:var(--c1)}
.chip.neutral{background:var(--surface-2);color:var(--ink-2)}
.chip.outline{background:transparent;color:var(--ink-2);border-color:var(--line-strong)}
.chip.dash{background:transparent;color:var(--ink-3);border:1px dashed var(--line-strong)}
.chip.wave1{background:var(--ok-soft);color:var(--ok-ink)} .chip.wave2{background:var(--info-soft);color:var(--c1)} .chip.wave3{background:var(--surface-2);color:var(--ink-2)}
.tag-mock{font-size:10.5px;font-weight:600;letter-spacing:.3px;color:var(--ink-3);border:1px solid var(--line-strong);border-radius:5px;padding:0 5px;line-height:16px;white-space:nowrap}
.tag-real{font-size:10.5px;font-weight:600;color:var(--ok-ink);border:1px solid var(--ok);border-radius:5px;padding:0 5px;line-height:16px;white-space:nowrap}
.assumed{display:inline-grid;place-items:center;width:17px;height:17px;border-radius:50%;background:var(--warn-soft);color:var(--warn-ink);font-size:11px;font-weight:700;cursor:help;flex:none}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;flex:none}
.dot.gray{background:transparent;border:2px solid var(--gray)}
.dot.none{display:none}
.dot.ok{background:var(--ok)} .dot.warn{background:var(--warn)} .dot.bad{background:var(--bad)}
.dot.miss{background:var(--gray)}
@media (prefers-reduced-motion:no-preference){.dot.bad{animation:pulse 1.8s ease-in-out infinite}}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(208,59,59,.45)}50%{box-shadow:0 0 0 6px rgba(208,59,59,0)}}
.st{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;white-space:nowrap}
.st.ok{color:var(--ok-ink)} .st.warn{color:var(--warn-ink)} .st.bad{color:var(--bad-ink)} .st.gray,.st.miss,.st.none{color:var(--ink-3);font-weight:500}
.d-good{color:var(--ok-ink);font-weight:600} .d-bad{color:var(--bad-ink);font-weight:600} .d-flat{color:var(--ink-3)} .d-info{color:var(--ink-2);font-weight:600}

/* ---------- buttons ---------- */
.btn{border-radius:9px;padding:6px 12px;cursor:pointer;font-weight:600;border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);font-size:13.5px;display:inline-flex;align-items:center;gap:6px;min-height:34px}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--navy-fill);border-color:var(--navy-fill);color:#fff}
.btn.primary:hover{filter:brightness(1.12)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--ink-2)}
.btn.sm{min-height:28px;padding:3px 9px;font-size:12.5px;font-weight:500}
.btn svg{width:15px;height:15px}
.seg{display:inline-flex;border:1px solid var(--line-strong);border-radius:9px;overflow:hidden;flex-wrap:wrap;background:var(--surface)}
.seg button{border:0;background:transparent;padding:5px 11px;font-size:13px;cursor:pointer;color:var(--ink-2)}
.seg button + button{border-left:1px solid var(--line-strong)}
.seg button[aria-pressed="true"]{background:var(--navy-fill);color:#fff;font-weight:600}

/* ---------- sections & grid ---------- */
.section{margin:22px 0 10px;display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap}
.section h2{margin:0;font-size:15.5px;font-weight:700}
.section .muted{font-size:12.5px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.grid{display:grid;gap:14px;margin-bottom:14px}
.g-2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g-3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g-21{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)}
.g-12{grid-template-columns:minmax(0,1fr) minmax(0,1.6fr)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:15px 17px;min-width:0;box-shadow:var(--shadow)}
.grid > .panel{margin:0}
.page > .panel{margin-bottom:14px}
.panel-head{display:flex;justify-content:space-between;align-items:flex-start;gap:8px 12px;margin-bottom:10px;flex-wrap:wrap}
.panel-head > div:first-child{flex:1 1 0;min-width:180px}
.panel h3{margin:0;font-size:15px;line-height:1.35;font-weight:600;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.panel .hint{margin:2px 0 0;font-size:12.5px;color:var(--ink-3)}
.chart-box{position:relative;height:260px}
.chart-box.sm{height:210px} .chart-box.lg{height:320px} .chart-box.xl{height:380px}
.chart-fallback{display:grid;place-items:center;height:100%;color:var(--ink-3);font-size:13px;text-align:center}
.foot{font-size:12px;color:var(--ink-3);margin:8px 2px 0;max-width:120ch}
.empty{padding:26px 10px;color:var(--ink-3);text-align:center;font-size:13.5px}
.banner{display:flex;align-items:center;gap:10px 14px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:10px;padding:10px 14px;margin-bottom:14px;font-size:13.5px;color:var(--ink-2)}
.banner b{color:var(--ink)}
.banner .grow{flex:1;min-width:220px}

/* ---------- KPI card (overview) ---------- */
.kcard{position:relative;display:flex;flex-direction:column;gap:2px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:13px 15px 11px;cursor:pointer;color:var(--ink);min-height:150px;box-shadow:var(--shadow);transition:border-color .15s, transform .15s}
.kcard:hover{border-color:var(--line-strong);transform:translateY(-1px)}
.kc-top{display:flex;align-items:center;gap:6px}
.kc-name{font-size:13.5px;font-weight:600;color:var(--ink-2);flex:1;min-width:0;line-height:1.35}
.kc-val{font-size:30px;font-weight:700;line-height:1.15;margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kc-unit{font-size:12.5px;font-weight:500;color:var(--ink-3);margin-left:5px}
.kc-ctx{font-size:12.5px;color:var(--ink-2);min-height:19px}
.kc-foot{display:flex;align-items:center;gap:8px;margin-top:auto;padding-top:6px;font-size:12px;color:var(--ink-3)}
.kc-foot .grow{flex:1}
.kc-foot svg.spark{flex:none}
.kcard.gap{border-style:dashed;cursor:default;background:transparent;box-shadow:none}
.kcard.gap:hover{transform:none;border-color:var(--line)}
.kcard.gap .kc-val{color:var(--ink-3);font-size:22px}
.kcard.dim{opacity:.38}
.meter{display:flex;height:10px;border-radius:5px;overflow:hidden;gap:2px;margin:8px 0 4px;background:transparent}
.meter i{display:block;height:100%}
.meter-legend{display:flex;flex-wrap:wrap;gap:2px 10px;font-size:11.5px;color:var(--ink-2)}
.meter-legend span{display:inline-flex;align-items:center;gap:4px}
.sw{width:8px;height:8px;border-radius:2px;display:inline-block;flex:none}

/* ---------- KPI strip (topic pages) ---------- */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:14px;box-shadow:var(--shadow)}
.kpi{padding:12px 16px;box-shadow:-1px 0 0 var(--line),0 -1px 0 var(--line);min-width:0;display:flex;flex-direction:column;gap:1px}
.kpi .k-top{display:flex;align-items:center;gap:6px}
.kpi .k-label{font-size:12.5px;color:var(--ink-2);flex:1;line-height:1.35}
.kpi .k-value{font-size:24px;font-weight:700;line-height:1.2;margin-top:3px;white-space:nowrap}
.kpi .k-unit{font-size:12px;font-weight:500;color:var(--ink-3);margin-left:4px}
.kpi .k-foot{font-size:12px;color:var(--ink-3);display:flex;gap:6px;flex-wrap:wrap;align-items:center}

/* ---------- decision brief (Hot issue) ---------- */
.brief{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;box-shadow:var(--shadow)}
.brief-head{display:flex;justify-content:space-between;align-items:baseline;gap:6px 14px;padding:13px 17px 9px;flex-wrap:wrap}
.brief-head h2{margin:0;font-size:17px;font-weight:700;display:flex;align-items:center;gap:8px}
.brief-item{display:grid;grid-template-columns:82px 118px minmax(0,1fr) auto auto;gap:6px 14px;align-items:center;padding:10px 17px;border-top:1px solid var(--line)}
.brief-item h4{margin:0;font-size:14.5px;font-weight:600;line-height:1.4}
.brief-item p{margin:1px 0 0;font-size:12.5px;color:var(--ink-2)}
.brief-item .when{font-size:12px;color:var(--ink-3);white-space:nowrap;text-align:right}
.brief-item .trend{font-size:12.5px;font-weight:600;white-space:nowrap}
.sev{font-size:12px;font-weight:600;border-radius:6px;padding:3px 7px;text-align:center;white-space:nowrap}
.sev.crit{background:var(--bad-soft);color:var(--bad-ink)}
.sev.high{background:var(--accent-soft);color:var(--accent-ink)}
.sev.med{background:var(--warn-soft);color:var(--warn-ink)}
.sev.info{background:var(--surface-2);color:var(--ink-2)}
.butag{font-size:11.5px;font-weight:600;border-radius:6px;padding:2px 8px;background:var(--surface-2);color:var(--ink-2);text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.link-btn{background:var(--surface);border:1px solid var(--line-strong);border-radius:8px;padding:4px 10px;cursor:pointer;font-size:12.5px;white-space:nowrap;color:var(--ink)}
.link-btn:hover{background:var(--surface-2)}
.restricted-note{display:flex;align-items:center;gap:8px;padding:9px 17px;border-top:1px solid var(--line);font-size:12.5px;color:var(--ink-3);background:var(--surface-2)}

/* ---------- tables ---------- */
.tablewrap{overflow:auto;margin:0 -2px;max-height:520px}
table.data{width:100%;border-collapse:collapse;font-size:13px}
table.data th{position:sticky;top:0;z-index:1;background:var(--surface);text-align:left;font-weight:600;color:var(--ink-2);padding:7px 9px;border-bottom:1px solid var(--line-strong);white-space:nowrap;vertical-align:bottom}
table.data td{padding:7px 9px;border-bottom:1px solid var(--line);vertical-align:top}
table.data .r{text-align:right;font-variant-numeric:tabular-nums}
table.data .c{text-align:center}
table.data tbody tr:hover td{background:var(--surface-2)}
table.data tfoot td{font-weight:700;border-top:1px solid var(--line-strong);border-bottom:0}
table.data td.heat{font-variant-numeric:tabular-nums;text-align:right}
.cell-sub{display:block;font-size:11.5px;color:var(--ink-3)}
table.data input[type=number]{width:96px;border:1px solid var(--line-strong);border-radius:6px;padding:3px 6px;background:var(--surface);color:var(--ink)}
table.data select{border:1px solid var(--line-strong);border-radius:6px;padding:2px 4px;background:var(--surface);color:var(--ink)}

/* ---------- bars (inline) ---------- */
.hbar{display:grid;grid-template-columns:minmax(90px,170px) minmax(0,1fr) 64px;gap:8px;align-items:center;padding:4px 0;font-size:13px}
.hbar .lbl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink-2)}
.hbar .trk{height:10px;background:var(--surface-2);border-radius:0 4px 4px 0;overflow:hidden}
.hbar .trk i{display:block;height:100%;background:var(--c1);border-radius:0 4px 4px 0}
.hbar .v{text-align:right;font-variant-numeric:tabular-nums;color:var(--ink)}

/* ---------- CCP line map ---------- */
.linemap{display:grid;grid-template-columns:repeat(7,minmax(118px,1fr));gap:20px;overflow-x:auto;padding:4px 2px 8px}
.lm-col{position:relative}
.lm-col:not(:last-child)::after{content:"";position:absolute;right:-20px;top:50%;width:20px;height:2px;background:var(--line-strong)}
.node{display:flex;flex-direction:column;gap:2px;width:100%;text-align:left;padding:10px 11px;border-radius:10px;border:1px solid var(--line);background:var(--surface);cursor:pointer;min-height:96px;color:var(--ink)}
.node:hover{border-color:var(--line-strong);background:var(--surface-2)}
.node[aria-pressed="true"]{border-color:var(--navy);box-shadow:inset 0 0 0 1px var(--navy)}
.n-top{display:flex;align-items:center;gap:6px;font-weight:600;font-size:13.5px;line-height:1.3}
.n-kpi{font-size:11px;color:var(--ink-3)}
.n-val{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums}
.n-sub{font-size:11.5px;color:var(--ink-3)}

/* ---------- heat cells ---------- */
.hc{display:inline-block;min-width:54px;padding:2px 6px;border-radius:5px;text-align:right}

/* ---------- details (catalog) ---------- */
details.kd summary{cursor:pointer;color:var(--c1);font-size:12px}
details.kd div{font-size:12.5px;color:var(--ink-2);margin-top:4px;max-width:60ch}
.formula{font-family:ui-monospace,Consolas,monospace;font-size:12px;background:var(--surface-2);padding:2px 6px;border-radius:5px;color:var(--ink)}

/* ---------- architecture diagram ---------- */
.arch{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;align-items:stretch}
.arch .col{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--surface-2)}
.arch .col h4{margin:0 0 6px;font-size:13px}
.arch .col ul{margin:0;padding-left:16px;font-size:12.5px;color:var(--ink-2)}
.arch .col.hub{background:var(--info-soft);border-color:transparent}
.arch-flow{display:flex;gap:6px;align-items:center;font-size:12px;color:var(--ink-3);margin-top:8px;flex-wrap:wrap}

/* ---------- chat drawer ---------- */
.chat{position:fixed;top:0;right:0;bottom:0;width:min(440px,100vw);background:var(--surface);border-left:1px solid var(--line);z-index:60;display:flex;flex-direction:column;transform:translateX(100%);visibility:hidden;transition:transform .25s ease,visibility 0s linear .25s;box-shadow:-12px 0 30px rgba(10,14,40,.18)}
.chat.open{transform:none;visibility:visible;transition:transform .25s ease}
@media (prefers-reduced-motion:reduce){.chat,.chat.open{transition:none}}
.chat-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:calc(14px + env(safe-area-inset-top,0px)) 16px 14px;background:var(--topbar);color:#fff}
.chat-head strong{font-size:16px}
.chat-mode{font-size:12px;color:var(--topbar-ink-2);margin-top:2px}
.icon-btn{background:none;border:1px solid rgba(255,255,255,.35);color:#fff;border-radius:8px;width:34px;height:34px;cursor:pointer;font-size:20px;line-height:1;flex:none}
.chat-suggest{display:flex;flex-wrap:wrap;gap:6px;padding:11px 16px;border-bottom:1px solid var(--line)}
.sugg{border:1px solid var(--line-strong);background:var(--surface);border-radius:999px;padding:4px 10px;font-size:12.5px;cursor:pointer;text-align:left;color:var(--ink)}
.sugg:hover{background:var(--accent-soft);border-color:var(--accent)}
.sugg:disabled{opacity:.5;cursor:not-allowed}
.chat-log{flex:1;overflow:auto;padding:14px 16px;display:flex;flex-direction:column;gap:12px}
.msg{max-width:92%;padding:9px 12px;border-radius:12px;font-size:13.5px;line-height:1.62;overflow-wrap:anywhere}
.msg.user{align-self:flex-end;background:var(--navy-fill);color:#fff;border-bottom-right-radius:4px;white-space:pre-wrap}
.msg.ai{align-self:flex-start;background:var(--surface-2);border-bottom-left-radius:4px}
.msg.ai p{margin:0 0 6px} .msg.ai p:last-child{margin-bottom:0}
.msg.ai ul{margin:4px 0 6px;padding-left:18px} .msg.ai li{margin:2px 0}
.msg .meta{display:block;font-size:11.5px;color:var(--ink-3);margin-top:6px}
.chat-form{border-top:1px solid var(--line);padding:11px 16px calc(14px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:8px}
.chat-form textarea{width:100%;resize:none;border:1px solid var(--line-strong);border-radius:10px;padding:8px 10px;background:var(--surface);min-height:60px;line-height:1.5}
.chat-actions{display:flex;justify-content:space-between;align-items:center;gap:8px}

/* ---------- tooltip & toast ---------- */
.tip{position:fixed;z-index:80;max-width:320px;background:var(--tip-bg);color:var(--tip-ink);font-size:12.5px;line-height:1.45;padding:7px 10px;border-radius:8px;pointer-events:none;opacity:0;transition:opacity .12s}
.tip.show{opacity:1}
.toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--tip-bg);color:var(--tip-ink);padding:9px 16px;border-radius:10px;font-size:13.5px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:90}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* ---------- Phase 1: สถานะภาพรวม · ตัวกรองที่ใช้อยู่ · การ์ด hero/compact · ข้อมูล KPI ---------- */
.net-pill{display:inline-flex;align-items:center;gap:7px;border-radius:999px;padding:4px 12px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.28);color:#fff;font-size:12.5px;cursor:pointer;white-space:nowrap;min-height:32px}
.net-pill:hover{background:rgba(255,255,255,.18)}
.net-pill b{font-weight:700}
.net-pill .sub{color:var(--topbar-ink-2)}
.fchips{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12.5px;color:var(--ink-3)}
.fchip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line-strong);background:var(--surface-2);border-radius:999px;padding:2px 5px 2px 10px;font-size:12.5px;color:var(--ink);cursor:pointer;line-height:1.6}
.fchip:hover{border-color:var(--c1)}
.fchip .x{display:inline-grid;place-items:center;width:16px;height:16px;border-radius:50%;background:var(--surface-3);color:var(--ink-2);font-size:11px;line-height:1}
.fchip.clear{background:transparent;border-style:dashed;color:var(--ink-2);padding:2px 10px}
.cards.hero{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.kcard.hero{min-height:172px;padding:15px 17px 12px}
.kcard.hero .kc-name{font-size:14px;color:var(--ink)}
.kcard.hero .kc-val{font-size:34px;margin-top:8px}
.kcard.hero .kc-unit{display:block;margin:2px 0 0;font-size:12px;white-space:normal}
.kcard.hero .kc-foot{gap:6px}
.kcard.hero .kc-foot svg.spark{margin-left:auto}
.kcard.compact{min-height:124px;padding:11px 13px 9px}
.kcard.compact .kc-val{font-size:23px;margin-top:3px}
.kcard.compact .kc-name{font-size:13px}
.kc-val.lown,.k-value.lown,.ki-val.lown{color:var(--ink-3)}
.kc-why{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.info-btn{flex:none;width:18px;height:18px;padding:0;border-radius:50%;border:1px solid var(--line-strong);background:var(--surface);color:var(--ink-3);font-size:11px;font-weight:700;font-style:italic;line-height:1;cursor:pointer;display:inline-grid;place-items:center}
.info-btn:hover,.info-btn:focus-visible{color:var(--c1);border-color:var(--c1)}
.focus-note{display:flex;align-items:center;gap:8px 12px;flex-wrap:wrap;font-size:12.5px;color:var(--ink-2);margin:14px 0 0}
.modal{position:fixed;inset:0;z-index:75;background:rgba(10,14,40,.45);display:grid;place-items:center;padding:16px}
.modal-card{background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:14px;width:100%;max-width:560px;max-height:min(86vh,780px);display:flex;flex-direction:column;box-shadow:0 20px 50px rgba(10,14,40,.3)}
.modal-card.wide{max-width:740px}
.modal-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:14px 18px;border-bottom:1px solid var(--line)}
.modal-head h2{margin:0;font-size:16.5px;line-height:1.35;text-wrap:balance}
.modal-x{flex:none;width:32px;height:32px;border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);border-radius:8px;font-size:18px;line-height:1;cursor:pointer}
.modal-body{padding:12px 18px 18px;overflow:auto;min-width:0}
.ki-head{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 14px;margin-bottom:8px}
.ki-val{font-size:28px;font-weight:700}
.ki-meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.ki-row{display:grid;grid-template-columns:150px minmax(0,1fr);gap:4px 14px;padding:8px 0;border-top:1px solid var(--line);font-size:13.5px}
.ki-row > span{color:var(--ink-3);font-size:12.5px}
.ki-row code{font-size:12px}
.ki-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.copy-area{width:100%;min-height:240px;border:1px solid var(--line-strong);border-radius:10px;padding:10px;background:var(--surface-2);color:var(--ink);font:inherit;font-size:13.5px;line-height:1.6;resize:vertical}

/* ---------- responsive ---------- */
@media (max-width:1180px){
  .g-21,.g-12,.g-3{grid-template-columns:minmax(0,1fr)}
  .brief-item{grid-template-columns:82px minmax(0,1fr) auto}
  .brief-item .butag{display:none}
  .arch{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:860px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .rail{position:sticky;top:env(safe-area-inset-top,0px);height:auto;display:flex;gap:4px;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line);padding:6px 10px;z-index:20}
  .rail-group,.rail-note{display:none}
  .rail button{width:auto;white-space:nowrap;flex:none}
  .topbar,.fbar{position:relative;top:0}
  .topbar{padding:9px 16px}
  .brand-sub,.proto-badge{display:none}
  .fbar{padding:8px 16px}
  main{padding:14px 16px 44px}
  .g-2{grid-template-columns:minmax(0,1fr)}
  .brief-item{grid-template-columns:minmax(0,1fr);gap:4px}
  .brief-item .sev{justify-self:start}
  .brief-item .when{text-align:left}
  .page-head h1{font-size:20px}
  .kc-val{font-size:26px}
  .arch{grid-template-columns:minmax(0,1fr)}
  .tb-btn span,.ask-lbl,.fl,.scope-note,.fbar .sep{display:none}
  .fchips{flex-basis:100%}
  .net-pill .sub{display:none}
  .topbar{flex-wrap:wrap;row-gap:8px}
  .brand{flex:1 1 100%}
  .tb-actions{flex:1 1 100%;justify-content:flex-end}
  .net-pill{margin-right:auto}
  .ki-row{grid-template-columns:minmax(0,1fr)}
  .brand-title{font-size:15px}
  .brand-mark{width:34px;height:34px}
  .btn-ask{padding:6px 10px}
  .fbar{gap:6px}
  .fbar .f{flex:1 1 calc(50% - 6px);min-width:0}
  .fbar .f select{width:100%;max-width:none}
  .fbar .toggle{flex:1 1 calc(50% - 6px)}
}

/* ---------- print (PDF สำหรับประชุมผู้บริหาร) ---------- */
@media print{
  .rail,.fbar .f select,.tb-actions,.chat,.toast,.head-actions,.btn,.info-btn,.fchip .x,.modal{display:none !important}
  .topbar,.fbar{position:static}
  .shell{display:block}
  main{padding:0}
  body{background:#fff}
  .panel,.kcard,.brief{break-inside:avoid;box-shadow:none}
}
</style>
</head>
<body>
<div class="boot" id="boot"><div><b>CQA Executive Dashboard</b>กำลังเตรียมข้อมูลและคำนวณ KPI…</div></div>

<header class="topbar" id="topbar">
  <div class="brand">
    <div class="brand-mark" aria-hidden="true">CQA</div>
    <div>
      <div class="brand-title">CQA Executive Dashboard</div>
      <div class="brand-sub" id="brand-sub">Food Safety &amp; Quality Monitoring</div>
    </div>
  </div>
  <div class="tb-actions">
    <button type="button" class="net-pill" id="net-status" hidden></button>
    <span class="proto-badge" id="proto-badge" data-tip="ต้นแบบ: ข้อมูลทุกชุดเป็น Mock ตาม schema และ seed ยอดรวมจาก PDF — นำเข้า CSV จริงได้ที่หน้า Data Hub">Prototype · Mock Data</span>
    <button class="tb-btn" id="btn-print" type="button" data-tip="พิมพ์ / บันทึกเป็น PDF สำหรับประชุม">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9V3h12v6"/><rect x="3" y="9" width="18" height="8" rx="2"/><path d="M6 14h12v7H6z"/></svg><span>PDF</span>
    </button>
    <button class="tb-btn" id="btn-theme" type="button" aria-label="สลับธีมสว่าง/มืด" data-tip="สลับธีมสว่าง / มืด">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    </button>
    <button class="btn-ask" id="open-chat" type="button" aria-controls="chat" aria-expanded="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1.1-4.4A8 8 0 1 1 21 12z"/><path d="M8.5 11h.01M12 11h.01M15.5 11h.01"/></svg>
      <span class="ask-lbl">ถาม </span>CQA AI
    </button>
  </div>
</header>

<div class="fbar" id="fbar" role="group" aria-label="ตัวกรองข้อมูล">
  <label class="f"><span class="fl">ช่วงเวลา</span> <select id="f-period" aria-label="ช่วงเวลา"></select></label>
  <label class="f"><span class="fl">BU</span> <select id="f-bu" aria-label="BU"></select></label>
  <label class="f"><span class="fl">หน่วยงาน</span> <select id="f-org" aria-label="หน่วยงาน"></select></label>
  <label class="f"><span class="fl">Wave</span> <select id="f-wave" aria-label="Wave">
    <option value="all">ทุก Wave</option><option value="1">Wave 1</option><option value="2">Wave 2</option><option value="3">Wave 3</option>
  </select></label>
  <span class="sep" aria-hidden="true"></span>
  <label class="toggle" data-tip="ซ่อนการ์ด/KPI ที่ยังใช้ Mock Data (แสดงเฉพาะ dataset ที่นำเข้าข้อมูลจริงแล้ว)"><input type="checkbox" id="f-realonly"> เฉพาะข้อมูลจริง</label>
  <label class="f"><span class="fl">บทบาท</span> <select id="f-role" aria-label="บทบาท">
    <option value="exec">ผู้บริหาร CQA (เห็น Restricted)</option>
    <option value="internal">ผู้ใช้ทั่วไป (Internal)</option>
  </select></label>
  <span class="spacer"></span>
  <div class="fchips" id="fchips" aria-label="ตัวกรองที่ใช้อยู่"></div>
</div>

<div class="shell">
  <nav class="rail" id="rail" aria-label="เมนูหลัก"></nav>
  <main id="main" tabindex="-1"></main>
</div>

<aside class="chat" id="chat" aria-label="CQA AI Assistant" inert>
  <div class="chat-head">
    <div>
      <strong>CQA AI Assistant</strong>
      <div class="chat-mode" id="chat-mode">กำลังตรวจสอบการเชื่อมต่อ AI</div>
    </div>
    <button class="icon-btn" id="close-chat" type="button" aria-label="ปิดหน้าต่างแชท">×</button>
  </div>
  <div class="chat-suggest" id="chat-suggest"></div>
  <div class="chat-log" id="chat-log" aria-live="polite"></div>
  <form class="chat-form" id="chat-form">
    <label class="small muted" for="chat-input">คำถาม</label>
    <textarea id="chat-input" rows="2" placeholder="เช่น สรุปเรื่องที่ต้องตัดสินใจวันนี้ หรือ ทำไม Complaint rate เดือนนี้สูงขึ้น"></textarea>
    <div class="chat-actions">
      <span class="muted small">Enter ส่ง · Shift+Enter ขึ้นบรรทัดใหม่</span>
      <span>
        <button type="button" class="btn" id="chat-stop" hidden>หยุด</button>
        <button type="submit" class="btn primary" id="chat-send">ส่งคำถาม</button>
      </span>
    </div>
  </form>
</aside>
<div class="modal" id="modal" hidden>
  <div class="modal-card" id="modal-card" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div class="modal-head"><h2 id="modal-title"></h2><button type="button" class="modal-x" id="modal-x" aria-label="ปิด">×</button></div>
    <div class="modal-body" id="modal-body"></div>
  </div>
</div>
<div class="tip" id="tip" role="tooltip"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<input type="file" id="file-input" accept=".csv,text/csv" hidden>
<input type="file" id="json-input" accept=".json,application/json" hidden>

<script>/* ==== 01_util.js ==== */
/* =====================================================================
   01_util.js — helpers ที่ใช้ร่วมกัน (browser + node)

(function (CQA) {
"use strict";

const U = {};

U.esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
U.nf = (n, d = 0) => (n == null || !isFinite(n)) ? "–" : Number(n).toLocaleString("en-US", { minimumFractionDigits: d, maximumFractionDigits: d });
U.sum = a => a.reduce((s, v) => s + (+v || 0), 0);
U.avg = a => a.length ? U.sum(a) / a.length : null;
U.clamp = (v, a, b) => Math.min(b, Math.max(a, v));
U.round = (v, d = 2) => Math.round(v * 10 ** d) / 10 ** d;

/* ---------- auto-format for KPI values ---------- */
U.fmtValue = (v, unit) => {
  if (v == null || !isFinite(v)) return "–";
  const a = Math.abs(v);
  if (unit === "%") return U.nf(v, a >= 100 ? 1 : 2);
  if (a >= 1000) return U.nf(v, 0);
  if (Number.isInteger(v)) return U.nf(v, 0);
  if (a >= 100) return U.nf(v, 1);
  return U.nf(v, 2);
};
U.compact = v => {
  if (v == null || !isFinite(v)) return "–";
  const a = Math.abs(v);
  if (a >= 1e9) return U.nf(v / 1e9, 2) + "B";
  if (a >= 1e6) return U.nf(v / 1e6, 2) + "M";
  if (a >= 1e4) return U.nf(v / 1e3, 1) + "K";
  return U.fmtValue(v);
};

/* ---------- dates (ISO strings: compare as text) ---------- */
U.TH_MON = ["ม.ค.", "ก.พ.", "มี.ค.", "เม.ย.", "พ.ค.", "มิ.ย.", "ก.ค.", "ส.ค.", "ก.ย.", "ต.ค.", "พ.ย.", "ธ.ค."];
U.TH_MON_FULL = ["มกราคม", "กุมภาพันธ์", "มีนาคม", "เมษายน", "พฤษภาคม", "มิถุนายน", "กรกฎาคม", "สิงหาคม", "กันยายน", "ตุลาคม", "พฤศจิกายน", "ธันวาคม"];
U.pad2 = n => String(n).padStart(2, "0");
U.ymd = d => d.getFullYear() + "-" + U.pad2(d.getMonth() + 1) + "-" + U.pad2(d.getDate());
U.parse = s => { const [y, m, d] = s.slice(0, 10).split("-").map(Number); return new Date(y, m - 1, d); };
U.daysIn = ym => { const [y, m] = ym.split("-").map(Number); return new Date(y, m, 0).getDate(); };
U.monthEnd = ym => ym + "-" + U.pad2(U.daysIn(ym));
U.prevMonth = ym => { const [y, m] = ym.split("-").map(Number); const d = new Date(y, m - 2, 1); return d.getFullYear() + "-" + U.pad2(d.getMonth() + 1); };
U.addDays = (s, n) => { const d = U.parse(s); d.setDate(d.getDate() + n); return U.ymd(d); };
U.diffDays = (a, b) => Math.round((U.parse(b) - U.parse(a)) / 864e5);
U.monLabel = ym => { const [y, m] = ym.split("-").map(Number); return U.TH_MON[m - 1] + " " + String(y + 543).slice(2); };
U.dateTH = s => { if (!s) return "–"; const d = U.parse(s); return d.getDate() + " " + U.TH_MON[d.getMonth()] + " " + String(d.getFullYear() + 543).slice(2); };
U.monthsBetween = (fromYm, toYm) => { const out = []; let c = fromYm; while (c <= toYm) { out.push(c); const [y, m] = c.split("-").map(Number); const d = new Date(y, m, 1); c = d.getFullYear() + "-" + U.pad2(d.getMonth() + 1); } return out; };

/* ---------- seeded random (deterministic mock) ---------- */
U.rng = seed => {
  let a = seed >>> 0;
  const r = () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };

  r.int = (lo, hi) => Math.floor(lo + (hi - lo + 1) * r());
  r.pick = arr => arr[Math.floor(r() * arr.length)];
  r.norm = () => { let u = 0, v = 0; while (!u) u = r(); while (!v) v = r(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); };

/* largest-remainder: แบ่ง N (จำนวนเต็ม) ตามน้ำหนัก ให้ผลรวมเท่ากับ N พอดี */
U.allocate = (N, weights) => {

  const raw = weights.map(w => N * w / W);
  const out = raw.map(Math.floor);
  let rest = N - U.sum(out);
  raw.map((v, i) => [v - Math.floor(v), i]).sort((a, b) => b[0] - a[0]).forEach(([, i]) => { if (rest > 0) { out[i]++; rest--; } });

/* scale ค่าทศนิยมให้ผลรวมตรง target (ทศนิยม d ตำแหน่ง) */
U.scaleTo = (vals, target, d = 2) => {

  const out = vals.map(v => Math.round(v / s * target * f) / f);

  return out;

/* ---------- CSV ---------- */
U.csvCell = v => { const s = String(v == null ? "" : v); return /[",\r\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
U.toCSV = rows => "﻿" + rows.map(r => r.map(U.csvCell).join(",")).join("\r\n");

  const rows = []; let row = [], cell = "", q = false;
  text = text.replace(/^﻿/, "");
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) {
      if (c === '"') { if (text[i + 1] === '"') { cell += '"'; i++; } else q = false; }
      else cell += c;
    } else if (c === '"') q = true;
    else if (c === ",") { row.push(cell); cell = ""; }
    else if (c === "\n" || c === "\r") { if (c === "\r" && text[i + 1] === "\n") i++; row.push(cell); rows.push(row); row = []; cell = ""; }
    else cell += c;
  }
  if (cell !== "" || row.length) { row.push(cell); rows.push(row); }
  return rows.filter(r => r.some(x => x !== ""));
};

/* ---------- Shared state: Target · Action items · Wave answers ----------
   เปิดใน Claude (artifact) → เก็บร่วมกันทั้งทีมผ่าน capability "db"
   เปิดเป็นไฟล์ → เก็บในเบราว์เซอร์นี้ (localStorage) */
const copy = v => v == null ? v : JSON.parse(JSON.stringify(v));
const Shared = CQA.Shared = {
  db: null, mode: "local", readOnly: false, mem: {}, fns: [], q: {},
  PATH: { thresholds: "shared/thresholds", actions: "shared/actions", waveq: "shared/waveq" },
  key: n => "cqa." + n + ".v1",
  get(name, d) {
    if (!(name in this.mem)) { try { const s = globalThis.localStorage && localStorage.getItem(this.key(name)); this.mem[name] = s ? JSON.parse(s) : null; } catch (e) { this.mem[name] = null; } }
    return this.mem[name] == null ? d : this.mem[name];
  },
  set(name, value) {
    this.mem[name] = value;
    try { localStorage.setItem(this.key(name), JSON.stringify(value)); } catch (e) { /* storage unavailable */ }
    if (!this.db || this.readOnly) return Promise.resolve(false);
    const ref = this.db.doc(this.PATH[name]), body = { value: copy(value), updated_at: new Date().toISOString() };
    const run = () => ref.set(body).then(() => true).catch(e => {
      if (e && ["invalid_argument", "not_granted", "revoked", "capability_disabled", "capability_removed"].includes(e.code)) { this.readOnly = true; this.emit("readonly"); }
      else this.emit("error");
      return false;
    });
    this.q[name] = (this.q[name] || Promise.resolve()).then(run);   // เขียนทีละครั้งต่อเอกสาร
    return this.q[name];
  },
  on(fn) { this.fns.push(fn); },
  emit(n) { this.fns.forEach(f => { try { f(n); } catch (e) { /* listener error */ } }); },
  async connect() {
    const cl = globalThis.claude;
    if (!cl || typeof cl.use !== "function") return;
    let db = null;
    try { db = await cl.use("db"); } catch (e) { db = null; }
    if (!db) return;
    this.db = db; this.mode = "shared";
    try { const user = await cl.use("user"); if (user) { const w = await user.can("data.write"); if (w === false) this.readOnly = true; } } catch (e) { /* not told */ }
    Object.entries(this.PATH).forEach(([name, path]) => {
      db.doc(path).onSnapshot(snap => {
        const v = snap.exists ? (snap.data() || {}).value : null;
        this.mem[name] = copy(v) || {};
        try { localStorage.setItem(this.key(name), JSON.stringify(this.mem[name])); } catch (e) { /* storage unavailable */ }
        this.emit(name);
      }, () => { this.emit("error"); });
    });
    this.emit("mode");
  },
};
})(globalThis.CQA = globalThis.CQA || {});

/* ==== 06_adapter.js ==== */
/* =====================================================================
   06_adapter.js — Data adapter (ข้อ 1 กฎข้อ 8: แยก data layer ออกจาก UI)
   - MockAdapter     : สร้างข้อมูลจำลองตาม schema (ค่าเริ่มต้น)
   - CSV import      : แทนที่ dataset ด้วยไฟล์จริงตาม template → is_mock = false
   - BigQueryAdapter : โครงสำหรับต่อ GCP QA Hub (KPI mart) ภายหลัง — UI ไม่ต้องแก้
   ===================================================================== */
(function (CQA) {
"use strict";
const U = CQA.U, M = CQA.META, store = CQA.store;

const A = CQA.Adapter = {};

A.adapters = {
  mock: {
    label: "Mock generator (ในเบราว์เซอร์)",
    async load() { MOCK = MOCK || CQA.generateMock(); return MOCK; },
  },

  bigquery: {

    endpoint: null,
    async load() {
      if (!this.endpoint) throw new Error("ยังไม่ได้ตั้งค่า endpoint ของ GCP QA Hub");

A.init = async (name) => {

/* ---------------- CSV import ---------------- */
function conv(v, type) {
  v = (v == null ? "" : String(v)).trim();
  if (v === "") return type === "INT" || type === "NUMERIC" ? null : "";
  switch (type) {
    case "INT": return parseInt(v.replace(/,/g, ""), 10);
    case "NUMERIC": return parseFloat(v.replace(/,/g, ""));
    case "BOOLEAN": return /^(y|yes|true|1)$/i.test(v) ? "Y" : "N";
    case "DATE": case "DATETIME": {
      let m = v.match(/^(\d{4})-(\d{1,2})-(\d{1,2})(?:[T ](\d{1,2}):(\d{2}))?/);
      if (!m) { const t = v.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})(?:\s+(\d{1,2}):(\d{2}))?/); if (t) m = [null, t[3], t[2], t[1], t[4], t[5]]; }
      if (!m) return v;
      let y = +m[1]; if (y > 2400) y -= 543;
      const d = y + "-" + U.pad2(m[2]) + "-" + U.pad2(m[3]);
      return type === "DATETIME" ? d + "T" + U.pad2(m[4] || 0) + ":" + (m[5] || "00") : d;
    }
    default: return v;
  }
}
A.parseCSV = (ds, text) => {
  const def = M.DS[ds]; if (!def) return { ok: false, errors: ["ไม่รู้จัก dataset " + ds] };
  const rows = U.parseCSV(text);
  if (!rows.length) return { ok: false, errors: ["ไฟล์ว่าง"] };
  const head = rows[0].map(h => h.trim());
  const missing = def.fields.filter(f => f.req && !head.includes(f.name)).map(f => f.name);
  if (missing.length) return { ok: false, errors: ["ไม่พบคอลัมน์บังคับ: " + missing.join(", ")] };
  const idx = Object.fromEntries(head.map((h, i) => [h, i]));
  const errors = [], out = [];
  rows.slice(1).forEach((r, li) => {
    const o = {};
    def.fields.forEach(f => { o[f.name] = idx[f.name] == null ? (f.type === "INT" || f.type === "NUMERIC" ? null : "") : conv(r[idx[f.name]], f.type); });
    const blank = def.fields.filter(f => f.req && (o[f.name] === "" || o[f.name] == null || (typeof o[f.name] === "number" && isNaN(o[f.name])))).map(f => f.name);
    if (blank.length) { if (errors.length < 6) errors.push(`แถว ${li + 2}: ค่าว่างใน ${blank.join(", ")}`); return; }
    out.push(o);
  });
  return { ok: out.length > 0, rows: out, errors, skipped: rows.length - 1 - out.length };
};
A.applyImport = async (ds, rows, filename) => {
  const meta = { is_mock: false, source: "CSV: " + filename, loaded_at: new Date().toLocaleString("th-TH"), rows: rows.length };
  store.set(ds, rows, meta);
  await idb.put(ds, { rows, meta });
};
A.resetDataset = async ds => {
  const D = await A.adapters.mock.load();
  store.set(ds, D[ds] || [], { is_mock: true, source: A.adapters.mock.label, loaded_at: M.UPDATED, rows: (D[ds] || []).length });
  await idb.del(ds);
};
A.restoreImports = async () => {
  const keys = await idb.keys();
  for (const k of keys) { const v = await idb.get(k); if (v && v.rows && M.DS[k]) store.set(k, v.rows, v.meta); }
};
A.templateRows = (ds, n = 3) => {
  const def = M.DS[ds], cols = def.fields.map(f => f.name);
  return [cols].concat(store.rows(ds).slice(0, n).map(r => cols.map(c => r[c] == null ? "" : r[c])));
};

/* ---------------- IndexedDB (เก็บไฟล์ที่นำเข้าไว้ในเบราว์เซอร์นี้) ---------------- */
const idb = (() => {
  let dbp = null;
  const open = () => dbp || (dbp = new Promise((res) => {
    try {
      if (!globalThis.indexedDB) return res(null);
      const rq = indexedDB.open("cqa-exec-dashboard", 1);
      rq.onupgradeneeded = () => rq.result.createObjectStore("imports");
      rq.onsuccess = () => res(rq.result);
      rq.onerror = () => res(null);
    } catch (e) { res(null); }
  }));
  const tx = async (mode, fn) => { const db = await open(); if (!db) return null; return new Promise(res => { try { const t = db.transaction("imports", mode), s = t.objectStore("imports"), rq = fn(s); rq.onsuccess = () => res(rq.result); rq.onerror = () => res(null); } catch (e) { res(null); } }); };
  return {
    put: (k, v) => tx("readwrite", s => s.put(v, k)),
    get: k => tx("readonly", s => s.get(k)),
    del: k => tx("readwrite", s => s.delete(k)),
    keys: async () => (await tx("readonly", s => s.getAllKeys())) || [],
  };
})();
})(globalThis.CQA = globalThis.CQA || {});

UI.initTooltip = () => {
  const tip = UI.$("#tip"); let cur = null;
  const show = el => {
    const txt = el.getAttribute("data-tip"); if (!txt) return;
    cur = el; tip.textContent = txt; tip.classList.add("show");
    const r = el.getBoundingClientRect(), tw = tip.offsetWidth, th = tip.offsetHeight;
    let x = r.left + r.width / 2 - tw / 2, y = r.top - th - 8;
    if (y < 6) y = r.bottom + 8;
    x = U.clamp(x, 6, innerWidth - tw - 6);
    tip.style.left = x + "px"; tip.style.top = y + "px";
  };
  const hide = () => { cur = null; tip.classList.remove("show"); };
  document.addEventListener("mouseover", e => { const el = e.target.closest("[data-tip]"); if (el && el !== cur) show(el); else if (!el && cur) hide(); });
  document.addEventListener("focusin", e => { const el = e.target.closest("[data-tip]"); if (el) show(el); });
  document.addEventListener("focusout", hide);
  document.addEventListener("scroll", hide, true);
};

const scope = () => `${H.periodLabel()}, ${CQA.App.scopeText()}`;

  },

const md = s => {
  const inline = x => x.replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
  let html = "", list = false;
  esc(s).split(/\r?\n/).forEach(raw => {
    const line = raw.trim(), m = line.match(/^(?:[-•]|\d+[.)])\s+(.*)$/);
    if (m) { if (!list) { html += "<ul>"; list = true; } html += "<li>" + inline(m[1]) + "</li>"; return; }
    if (list) { html += "</ul>"; list = false; }
    if (line) html += "<p>" + inline(line.replace(/^#{1,4}\s+/, "")) + "</p>";
  });
  return html + (list ? "</ul>" : "");
};
const meta = t => `<span class="meta">${esc(t)}</span>`;
const add = (role, content, html) => { const d = document.createElement("div"); d.className = "msg " + role; if (html) d.innerHTML = content; else d.textContent = content; $("#chat-log").appendChild(d); $("#chat-log").scrollTop = 1e9; return d; };

async function send(text) {
  const q = (text || "").trim(); if (!q || chat.busy) return;
  add("user", q); $("#chat-input").value = "";
  const bubble = add("ai", '<span class="muted">กำลังคิด…</span>', true);
  busy(true);
  if (chat.mode === "checking") await chat.ready;
  if (!chat.sample) { bubble.innerHTML = md(local(q)) + meta("ตอบจากกฎพื้นฐานบนข้อมูลหน้านี้ (ไม่ได้ใช้ AI)"); busy(false); return; }
  chat.turns.push({ role: "user", content: q });
  const input = [{ role: "user", content: RULES + "\n\nDATA (JSON):\n" + JSON.stringify(context()) }, { role: "assistant", content: "รับทราบ พร้อมตอบจาก DATA" }].concat(chat.turns.slice(-8));
  chat.ctl = new AbortController();
  try {
    const res = await chat.sample(input, { cache: false, signal: chat.ctl.signal, onText: ({ text: t }) => { bubble.innerHTML = md(t); $("#chat-log").scrollTop = 1e9; } });
    bubble.innerHTML = md(res.text) + (res.truncated ? meta("คำตอบถูกตัดเพราะยาวเกิน") : "");
    chat.turns.push({ role: "assistant", content: res.text });
  } catch (e) {
    const code = e && e.code, keep = e && e.text;
    if (code === "cancelled") { bubble.innerHTML = (keep ? md(keep) : "") + meta("หยุดแล้ว"); if (keep) chat.turns.push({ role: "assistant", content: keep }); else chat.turns.pop(); }
    else if (HIDE.includes(code)) { chat.sample = null; chat.mode = "local"; setMode(); chat.turns.pop(); bubble.innerHTML = md(local(q)) + meta("AI ใช้งานไม่ได้ในมุมมองนี้ จึงตอบจากกฎพื้นฐาน"); }
    else { if (code === "prompt_too_large") chat.turns = []; else if (keep) chat.turns.push({ role: "assistant", content: keep }); else chat.turns.pop(); bubble.innerHTML = (keep ? md(keep) : "") + meta(ERR[code] || "การเชื่อมต่อขัดข้อง ส่งคำถามอีกครั้งได้"); }
  } finally { chat.ctl = null; busy(false); }
}

const fillOrg = () => {
  const s = App.state, orgs = KPI.rows({ ds: "dim_org", agg: "count", field: "org_code", where: { active_flag: "Y" }, period: "stock" }, KPI.ctx({ bu: s.bu })).sort((a, b) => a.org_code.localeCompare(b.org_code));
  if (s.org !== "all" && !orgs.some(o => o.org_code === s.org)) s.org = "all";
  $("#f-org").innerHTML = `<option value="all">ทุกหน่วยงาน (${orgs.length})</option>` + orgs.map(o => `<option value="${esc(o.org_code)}"${o.org_code === s.org ? " selected" : ""}>${esc(o.org_code + " · " + o.org_name)}</option>`).join("");
};
/* ---------- สถานะภาพรวม (จาก Hot Issue · เกณฑ์ Proposed) ---------- */
const buildPill = () => {
  const b = $("#net-status"); if (!b) return;
  let lv; try { lv = CQA.briefLevel(); } catch (e) { b.hidden = true; return; }
  b.hidden = false;
  b.innerHTML = `<span class="dot ${lv.cls}" aria-hidden="true"></span><span>ภาพรวม: <b>${lv.label}</b></span><span class="sub">วิกฤต ${lv.crit} · สูง ${lv.high}</span>`;
  b.setAttribute("aria-label", `สถานะภาพรวม ${lv.label} วิกฤต ${lv.crit} สูง ${lv.high} — ไปหน้า Hot Issue`);
  b.setAttribute("data-tip", "คำนวณจาก Hot Issue ในขอบเขตที่เลือก (เกณฑ์ความรุนแรง Proposed) ไม่ใช่สถานะ KPI ตาม Target · คลิกเพื่อดูรายการ");
};
/* ---------- ตัวกรองที่ใช้อยู่ (กดเพื่อล้าง) ---------- */
const buildChips = () => {
  const s = App.state, out = [], chip = (key, label) => out.push(`<button type="button" class="fchip" data-clear="${key}" aria-label="ล้างตัวกรอง ${esc(label)}">${esc(label)}<span class="x" aria-hidden="true">×</span></button>`);
  if (s.period !== "ytd") chip("period", "ช่วงเวลา: " + U.monLabel(s.period));
  if (s.bu !== "all") chip("bu", "BU: " + s.bu);
  if (s.org !== "all") chip("org", "หน่วยงาน: " + s.org);
  if (s.wave !== "all") chip("wave", "Wave " + s.wave);
  if (s.realOnly) chip("realOnly", "เฉพาะข้อมูลจริง");
  if (s.role !== "exec") chip("role", "สิทธิ์: Internal");
  if (s.page === "complaint" && s.cf.nature !== "all") chip("cf.nature", "Nature: " + s.cf.nature);
  if (s.page === "complaint" && s.cf.channel !== "all") chip("cf.channel", "ช่องทาง: " + s.cf.channel);
  if (s.page === "pathogen" && s.pg !== "all") chip("pg", "ผลิตภัณฑ์: " + s.pg);
  if (s.page === "overview" && s.focus) chip("focus", "เฉพาะเรื่องที่ต้องดู");
  $("#fchips").innerHTML = out.length ? out.join("") + (out.length > 1 ? `<button type="button" class="fchip clear" data-clear="all">ล้างทั้งหมด</button>` : "") : `<span>${esc(CQA.H.periodLabel())} · ${esc(App.scopeText())}</span>`;
};
const DEFAULTS = { period: "ytd", bu: "all", org: "all", wave: "all", realOnly: false, role: "exec", pg: "all", focus: false };
const clearFilter = key => {
  const s = App.state;
  if (key === "all") { Object.assign(s, DEFAULTS); s.cf = { nature: "all", channel: "all" }; }
  else if (key.startsWith("cf.")) s.cf[key.slice(3)] = "all";
  else s[key] = DEFAULTS[key];
  syncFilters(); persist(); App.render();
};
const syncFilters = () => {
  const s = App.state;
  $("#f-period").value = s.period; $("#f-bu").value = s.bu; $("#f-wave").value = s.wave; $("#f-role").value = s.role; $("#f-realonly").checked = !!s.realOnly;
  fillOrg();
};

const initFilters = () => {
  const s = App.state;
  $("#f-period").innerHTML = `<option value="ytd">YTD ม.ค.–${U.monLabel(M.MONTHS[M.MONTHS.length - 1])}</option>` + M.MONTHS.slice().reverse().map(m => `<option value="${m}">${U.TH_MON_FULL[+m.slice(5) - 1]} ${+m.slice(0, 4) + 543}</option>`).join("");
  $("#f-bu").innerHTML = `<option value="all">ทุก BU</option>` + M.BUS.map(b => `<option>${esc(b)}</option>`).join("");
  $("#f-period").value = s.period; $("#f-bu").value = s.bu; $("#f-wave").value = s.wave; $("#f-role").value = s.role; $("#f-realonly").checked = !!s.realOnly;
  fillOrg();
  const on = (id, fn) => $(id).addEventListener("change", e => { fn(e.target); persist(); App.render(); });
  on("#f-period", el => { s.period = el.value; });
  on("#f-bu", el => { s.bu = el.value; fillOrg(); });
  on("#f-org", el => { s.org = el.value; });
  on("#f-wave", el => { s.wave = el.value; });
  on("#f-role", el => { s.role = el.value; UI.toast(el.value === "exec" ? "บทบาทผู้บริหาร: แสดงข้อมูล Restricted" : "บทบาท Internal: ซ่อน Negative incident ที่เป็น Restricted"); });
  on("#f-realonly", el => { s.realOnly = el.checked; });
  $("#brand-sub").textContent = `Food Safety & Quality Monitoring · ข้อมูลถึง ${U.dateTH(M.AS_OF)} · อัปเดต ${M.UPDATED}`;
};

/* ---------- actions ---------- */
let pendingImport = null;
Object.assign(CQA.ACTS, {
  "export-kpi": () => { const ctx = App.ctx(); UI.download(`cqa-kpi-${App.state.period}.csv`, U.toCSV([["kpi_id", "content_id", "topic", "name", "value", "unit", "numerator", "denominator", "direction", "frequency", "confidence", "wave", "target", "tolerance", "status", "is_mock", "period", "scope"]].concat(CQA.KPIS.map(k => { const v = KPI.value(k, ctx), th = CQA.TH.get(k.id) || {}; return [k.id, k.content, k.topic, k.name, v.value == null ? "" : U.round(v.value, 4), k.unit, v.num, v.den == null ? "" : v.den, k.dir, k.freq, k.conf, k.wave, th.target == null ? "" : th.target, th.tolerance == null ? "" : th.tolerance, CQA.statusOf(k, v.value).label, v.mock ? "yes" : "no", CQA.H.periodLabel(), App.scopeText()]; })))); },
  "demo-targets": () => { CQA.TH.loadDemo(); UI.toast("ใส่เป้าหมายสาธิตแล้ว — ไม่ใช่ค่าที่อนุมัติ"); App.render(); },
  "th-clear": () => { CQA.TH.clear(); UI.toast("ล้าง Target แล้ว"); App.render(); },
  "th-export": () => UI.download("thresholds.json", JSON.stringify(Object.fromEntries(CQA.KPIS.map(k => [k.id, CQA.TH.get(k.id) || { target: null, tolerance: null }])), null, 2), "application/json"),
  "th-import": () => $("#json-input").click(),
  "focus-off": () => { App.state.focus = false; persist(); App.render(); },
  "copy-brief": () => {
    const text = CQA.briefText();
    const fallback = () => { UI.openModal("คัดลอกสรุป", `<p class="hint" style="margin:0 0 8px">กด Ctrl+C (หรือค้างเพื่อคัดลอกบนมือถือ) แล้ววางใน LINE หรืออีเมล</p><textarea class="copy-area" id="copy-area" readonly>${esc(text)}</textarea>`); const ta = $("#copy-area"); ta.focus(); ta.select(); };
    try { navigator.clipboard.writeText(text).then(() => UI.toast("คัดลอกสรุปแล้ว — วางใน LINE หรืออีเมลได้เลย"), fallback); } catch (e) { fallback(); }
  },
  tpl: ds => UI.download(`template_${ds}.csv`, U.toCSV(CQA.Adapter.templateRows(ds))),
  imp: ds => { pendingImport = ds; $("#file-input").value = ""; $("#file-input").click(); },
  reset: async ds => { await CQA.Adapter.resetDataset(ds); App.lastImport = null; UI.toast(`${ds} กลับเป็น Mock แล้ว`); App.render(); },
});

/* ---------- init ---------- */
async function init() {
  UI.initTooltip();
  if (globalThis.claude) ["#btn-print", "#btn-theme"].forEach(s => { const b = $(s); if (b) b.hidden = true; });  // viewer คุมธีมเอง และไม่อนุญาตการพิมพ์
  try { const th = localStorage.getItem(THEME_KEY); if (th) document.documentElement.setAttribute("data-theme", th); } catch (e) { /* storage unavailable */ }
  await CQA.Adapter.init("mock");
  initFilters();
  CQA.AI.init();

  $("#rail").addEventListener("click", e => { const b = e.target.closest("[data-page]"); if (b) App.navTo(b.dataset.page); });
  $("#fbar").addEventListener("click", e => { const c = e.target.closest("[data-clear]"); if (c) clearFilter(c.dataset.clear); });
  $("#net-status").addEventListener("click", () => App.navTo("hotissue"));
  /* การ์ด KPI เป็น role=button: เปิดด้วย Enter / Space */
  $("#main").addEventListener("keydown", e => {
    if ((e.key === "Enter" || e.key === " ") && e.target.matches('[role="button"][data-go]')) { e.preventDefault(); if (e.target.dataset.go) App.navTo(e.target.dataset.go); }
  });
  /* modal: ปิดด้วย ×, คลิกพื้นหลัง, Esc · ปุ่มนำทางในข้อมูล KPI */
  $("#modal-x").addEventListener("click", UI.closeModal);
  $("#modal").addEventListener("click", e => {
    if (e.target.id === "modal") { UI.closeModal(); return; }
    const mg = e.target.closest("[data-modal-go]"); if (mg) { const go = mg.dataset.modalGo; UI.closeModal(); App.navTo(go); }
  });
  document.addEventListener("keydown", e => { if (e.key === "Escape" && !$("#modal").hidden) UI.closeModal(); });
  const main = $("#main");
  main.addEventListener("click", e => {
    const ki = e.target.closest("[data-kinfo]"); if (ki) { e.stopPropagation(); UI.kinfo(ki.dataset.kinfo); return; }
    const g = e.target.closest("[data-go]"); if (g && g.dataset.go) { App.navTo(g.dataset.go); return; }
    const st = e.target.closest("[data-set]");
    if (st) { const [key, val] = st.dataset.set.split(/:(.+)/); const p = key.split("."); if (p.length === 2) App.state[p[0]][p[1]] = val; else App.state[key] = val; App.render(false, `[data-set="${CSS.escape(st.dataset.set)}"]`); return; }
    const a = e.target.closest("[data-act]");
    if (a) { const [name, arg] = a.dataset.act.split(/:(.+)/); if (CQA.ACTS[name]) CQA.ACTS[name](arg); }
  });
  main.addEventListener("change", e => {
    const t = e.target;
    if (t.matches("[data-th]")) { const [id, f] = t.dataset.th.split(":"), cur = CQA.TH.get(id) || {}; const nv = t.value === "" ? null : +t.value; const tgt = f === "target" ? nv : cur.target, tol = f === "tolerance" ? nv : cur.tolerance; CQA.TH.set(id, tgt, tol, "owner"); App.render(false, `[data-th="${t.dataset.th}"]`); return; }
    if (t.matches("[data-wq]")) { const [id, q] = t.dataset.wq.split(":"); CQA.setWaveAnswer(id, q, t.checked); App.render(false, `[data-wq="${t.dataset.wq}"]`); return; }
    if (t.matches("[data-actst]")) { CQA.setActionStatus(t.dataset.actst, t.value).then(ok => { if (ok) UI.toast("บันทึกสถานะให้ทีมแล้ว"); else if (CQA.Shared.mode === "local") UI.toast("บันทึกสถานะในเบราว์เซอร์นี้แล้ว"); }); return; }
    if (t.matches("[data-setbool]")) { App.state[t.dataset.setbool] = t.checked; persist(); App.render(false, `[data-setbool="${t.dataset.setbool}"]`); return; }
    if (t.matches("[data-setsel]")) { App.state[t.dataset.setsel] = t.value; App.render(false, `[data-setsel="${t.dataset.setsel}"]`); }
  });
  main.addEventListener("input", e => {
    const t = e.target; if (!t.matches("[data-filter-table]")) return;
    const q = t.value.trim().toLowerCase();
    $$("#" + t.dataset.filterTable + " tbody tr").forEach(tr => { tr.hidden = q && !(tr.dataset.rowText || tr.textContent.toLowerCase()).includes(q); });
  });
  $("#file-input").addEventListener("change", async e => {
    const file = e.target.files && e.target.files[0]; if (!file || !pendingImport) return;
    const text = await file.text(), ds = pendingImport, res = CQA.Adapter.parseCSV(ds, text);
    if (res.ok) { await CQA.Adapter.applyImport(ds, res.rows, file.name); UI.toast(`นำเข้า ${ds} ${U.nf(res.rows.length)} แถวแล้ว`); }
    else UI.toast("นำเข้าไม่สำเร็จ: " + (res.errors[0] || ""));
    App.lastImport = { ds, ok: res.ok, n: res.rows ? res.rows.length : 0, skipped: res.skipped || 0, errors: res.errors || [] };
    if (ds === "dim_org") fillOrg();
    App.render();
  });
  $("#json-input").addEventListener("change", async e => {
    const file = e.target.files && e.target.files[0]; if (!file) return;
    try { const o = JSON.parse(await file.text()); let n = 0; Object.entries(o).forEach(([id, v]) => { if (CQA.KPI_BY_ID[id] && v && v.target != null) { CQA.TH.set(id, v.target, v.tolerance, v.source || "owner"); n++; } }); UI.toast(`นำเข้า Target ${n} KPI`); App.render(); }
    catch (err) { UI.toast("ไฟล์ thresholds.json ไม่ถูกต้อง"); }
    e.target.value = "";
  });
  $("#btn-print").addEventListener("click", () => window.print());
  $("#btn-theme").addEventListener("click", () => {
    const r = document.documentElement, dark = r.getAttribute("data-theme") ? r.getAttribute("data-theme") === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
    r.setAttribute("data-theme", dark ? "light" : "dark"); try { localStorage.setItem(THEME_KEY, dark ? "light" : "dark"); } catch (e2) { /* storage unavailable */ }
    App.render();
  });
  if (globalThis.matchMedia) { const mq = matchMedia("(prefers-color-scheme: dark)"); if (mq.addEventListener) mq.addEventListener("change", () => App.render()); }
  const setH = () => { document.documentElement.style.setProperty("--topbar-h", $("#topbar").offsetHeight + "px"); document.documentElement.style.setProperty("--fbar-h", $("#fbar").offsetHeight + "px"); };
  setH(); window.addEventListener("resize", setH);

  App.render(true);
  $("#boot").hidden = true;

  /* shared state (Target · Action items · Wave) — เปิดใน Claude จะซิงก์ทั้งทีม */
  let pending = false, raf = 0;
  const inMainInput = () => { const a = document.activeElement; return a && $("#main").contains(a) && /^(INPUT|SELECT|TEXTAREA)$/.test(a.tagName); };
  const later = () => { if (inMainInput()) { pending = true; return; } cancelAnimationFrame(raf); raf = requestAnimationFrame(() => App.render()); };
  $("#main").addEventListener("focusout", () => { if (pending) { pending = false; setTimeout(later, 0); } });
  CQA.Shared.on(name => {
    if (name === "thresholds") CQA.TH.load();
    if (name === "readonly") UI.toast("บัญชีของคุณดูได้อย่างเดียว — ค่าที่แก้จะไม่ถูกบันทึกให้ทีม");
    if (name === "error") UI.toast("บันทึกให้ทีมไม่สำเร็จ ลองอีกครั้ง");
    later();
  });
  CQA.Shared.connect();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => App.render());
}
if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", init); else init();
})(globalThis.CQA = globalThis.CQA || {});
</script>
</body>
</html>
